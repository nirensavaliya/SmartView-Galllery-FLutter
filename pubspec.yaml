name: gallery_photos
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1

environment:
  sdk: ^3.12.1


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.3
  permission_handler: ^13.0.2
  photo_manager: ^3.12.0
  path_provider: ^2.1.5
  disk_space_plus: ^0.2.6
  share_plus: ^13.3.0
  file_picker: ^12.2.0
  image: ^4.5.4
  video_player: ^2.14.0
  wallpaper_manager_plus: ^2.0.4
  pro_image_editor: 13.5.0
  fluttertoast:
  get_storage: ^2.1.1
  image_picker: ^1.2.3
  wallpaper_manager_flutter: ^1.0.1
  carousel_slider: ^5.1.2
  geocoding: ^5.0.0
  change_app_package_name: ^1.5.0
  audioplayers: ^6.8.1
  google_mlkit_image_labeling: ^0.16.1
  google_mlkit_text_recognition: ^0.17.1
  crypto: ^3.0.7
  google_maps_flutter: ^2.18.1
  url_launcher: ^6.3.2
  local_auth: ^3.0.2
  image_hash: ^1.1.0
  camera: ^0.11.2
  google_mlkit_face_detection: ^0.15.1
  tflite_flutter: ^0.12.1
  shared_preferences: ^2.5.5
  photo_manager_image_provider: ^2.2.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0


flutter:


  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
     - assets/fonts/
     - assets/images/
     - assets/Music/
     - assets/models/mobilefacenet.tflite
     - assets/data/cities.csv

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Roboto-Bold
      fonts:
        - asset: assets/fonts/Roboto-Bold.ttf
    - family: Roboto-BoldItalic
      fonts:
        - asset: assets/fonts/Roboto-BoldItalic.ttf
    - family: Roboto-ExtraBold
      fonts:
        - asset: assets/fonts/Roboto-ExtraBold.ttf
    - family: Roboto-Italic
      fonts:
        - asset: assets/fonts/Roboto-Italic.ttf
    - family: Roboto-Light
      fonts:
        - asset: assets/fonts/Roboto-Light.ttf
    - family: Roboto-Medium
      fonts:
        - asset: assets/fonts/Roboto-Medium.ttf
    - family: Roboto-Regular
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
    - family: Roboto-SemiBold
      fonts:
        - asset: assets/fonts/Roboto-SemiBold.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
